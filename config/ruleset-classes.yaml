# Ruleset classes: which declared rulesets a repository carries.
#
# Ruleset bodies live in config/rulesets/<name>.json; the ruleset_class
# of each repository is set in config/repositories.yaml. The tool is
# workflows/repository-config/.

ruleset_classes:
  # Automated releases: release rulesets, tag protection and main protection.
  api-repository:
    rulesets:
      - release-snapshot-protection
      - release-pointer-protection
      - pre-release-pointer-protection
      - release-tag-protection
      - Only_Codeowner_Can_Merge
      - Codeowner_review_required

  # Manual releases: main protection only.
  non-api:
    rulesets:
      - Only_Codeowner_Can_Merge
      - Codeowner_review_required

# Added, whatever the ruleset class, on a repository whose registry entry sets
# the flag. `legacy_releases`: release branches from before the release
# automation (release-x.y.z, release-vx.y.z), kept unchanged.
flag_rulesets:
  legacy_releases:
    - legacy-release-protection

# Absent (not disabled) on a repository with `single_codeowner: true`.
single_codeowner_excludes:
  - Codeowner_review_required

# Removed wherever found, in every ruleset class.
retired:
  - code-owner-review-required-or-sole-codeowner
  - release-review-protection
  - release-snapshot-pr-rules
