# Repository registry: one entry per organisation repository, keyed by name.
#
# class: api-repository | non-api | unmanaged (see repository-classes.yaml)
# single_codeowner: true when the default branch's CODEOWNERS `*` line names one user;
#   `plan` cross-checks the flag against CODEOWNERS.
# archived: true for archived repositories (rulesets are skipped).
# A GitHub repository without an entry is reported as unregistered.

